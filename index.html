<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Explore an interactive 3D wedding mandap with sunset and evening lighting, floral details, and a guided venue tour.">
<title>Wedding Mandap 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600&display=swap">
<style>
  /* Layout: full-bleed 3D canvas; title top-left, controls right, view bar bottom, floor-plan map bottom-left */
  :root {
    --bg: #14080c;
    --panel: rgba(28, 12, 18, 0.78);
    --line: rgba(255, 190, 110, 0.22);
    --fg: #fbeedd;
    --muted: #cdb29a;
    --marigold: #ffa31f;
    --crimson: #c8102e;
    --display: "Marcellus", "Palatino Linotype", Georgia, serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; overflow: hidden; }
  #stage3d { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #title { top: calc(env(safe-area-inset-top, 0px) + 12px); left: 16px; padding: 12px 16px; max-width: calc(100vw - 32px); }
  #title h1 { margin: 0; font: 400 22px/1.1 var(--display); letter-spacing: 0.02em; color: var(--marigold); }
  #title p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

  #options { top: calc(env(safe-area-inset-top, 0px) + 12px); right: 16px; width: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  #options input[type="text"] { background: rgba(255,255,255,0.06); border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 7px 9px; font: 14px var(--body); min-width: 0; }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px; }
  .toggles button { flex: 1 1 auto; }
  #optToggle { display: none; }

  button { font: 500 13px var(--body); color: var(--fg); background: rgba(255,255,255,0.07); border: 1px solid var(--line); border-radius: 7px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
  button:hover { background: rgba(255,163,31,0.16); }
  button[aria-pressed="true"], button.active { background: var(--marigold); color: #2a1204; border-color: var(--marigold); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--marigold); outline-offset: 2px; }

  #views { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; gap: 6px; padding: 8px; max-width: calc(100vw - 32px); overflow-x: auto; }
  #map { left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); padding: 6px; }
  #map canvas { display: block; width: 104px; height: 143px; }
  #hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 68px); color: var(--muted); font-size: 12px; text-shadow: 0 1px 4px #000; pointer-events: none; text-align: center; width: max-content; max-width: calc(100vw - 32px); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); font: 22px var(--display); color: var(--marigold); transition: opacity .6s; }
  #loading.done { opacity: 0; pointer-events: none; }

  @media (max-width: 720px) {
    #optToggle { display: block; position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 16px; }
    #options { top: calc(env(safe-area-inset-top, 0px) + 56px); }
    #options.closed { display: none; }
    #title { max-width: calc(100vw - 120px); padding: 8px 12px; }
    #title h1 { font-size: 17px; }
    #title p { display: none; }
    #map { display: none; }
    #hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { #loading { transition: none; } }
</style>

</head>
<body>
<div id="stage3d"></div>

<div id="title" class="panel">
  <h1>Wedding Mandap</h1>
  <p>Open lawn at evening glow &middot; drag to look around</p>
</div>

<button id="optToggle" aria-expanded="true">Options</button>
<div id="options" class="panel">
  <div class="toggles">
    <button id="tSunset" aria-pressed="false">Sunset</button>
    <button id="tEvening" aria-pressed="true">Evening glow</button>
    <button id="tLabels" aria-pressed="true">Labels</button>
    <button id="tSpin" aria-pressed="false">Spin</button>
  </div>
</div>

<div id="map" class="panel"><canvas id="mapCanvas" width="208" height="286" aria-label="Floor plan"></canvas></div>

<div id="hint">Pick a view below</div>
<div id="views" class="panel" role="group" aria-label="Camera views">
  <button data-view="overview" class="active">Overview</button>
  <button data-view="entry">From entry</button>
  <button data-view="guest">Guest seat</button>
  <button data-view="stage">Mandap close-up</button>
  <button data-view="canopy">Floral chandelier</button>
  <button data-view="top">Floor plan</button>
  <button data-view="tour">Walk-in tour</button>
</div>

<div id="loading">Setting up the venue&hellip;</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script>
(function () {
  "use strict";

  // ---------- Venue dimensions (metres), matching the hand sketch ----------
  // Hall 32 x 44. Stage at the back (-z), seating in the middle, entry on the left wall near the front (+z).
  var HALL_W = 32, HALL_D = 44, HALL_H = 10;
  var STAGE = { x: 0, z: -14, r: 5, h: 0.9 };
  var DOOR = { z0: 13.5, z1: 17.5, h: 4.6 };

  var rngSeed = 7;
  function rnd() { rngSeed |= 0; rngSeed = rngSeed + 0x6D2B79F5 | 0; var t = Math.imul(rngSeed ^ rngSeed >>> 15, 1 | rngSeed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
  function rr(a, b) { return a + rnd() * (b - a); }

  // ---------- Renderer, scene, camera ----------
  var host = document.getElementById("stage3d");
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.8;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  host.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var DAY_BG = new THREE.Color(0xb9cfe6), NIGHT_BG = new THREE.Color(0x0a0610);
  

  var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1500);
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 1.5;
  controls.maxDistance = 90;
  controls.maxPolarAngle = Math.PI * 0.51;

  // Reflection environments so brass and gold read as metal: one for sunset, one for the evening sky.
  var envSunset, envEvening;
  (function environments() {
    function make(top, hor, ground) {
      var envScene = new THREE.Scene(), geo = new THREE.SphereGeometry(10, 32, 16), cols = [], pos = geo.attributes.position, c = new THREE.Color();
      for (var i = 0; i < pos.count; i++) {
        var y = pos.getY(i) / 10;
        if (y > 0) c.copy(hor).lerp(top, Math.min(1, y * 1.6)); else c.copy(ground);
        cols.push(c.r, c.g, c.b);
      }
      geo.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3));
      envScene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true })));
      var pm = new THREE.PMREMGenerator(renderer), t = pm.fromScene(envScene, 0.04).texture; pm.dispose(); return t;
    }
    envSunset = make(new THREE.Color(0.35, 0.42, 0.62), new THREE.Color(0.9, 0.62, 0.42), new THREE.Color(0.25, 0.3, 0.14));
    envEvening = make(new THREE.Color(0.03, 0.04, 0.08), new THREE.Color(0.2, 0.11, 0.1), new THREE.Color(0.03, 0.03, 0.025));
    scene.environment = envEvening;
  })();

  // ---------- Helpers ----------
  function canvasTex(w, h, draw, rx, ry) {
    var c = document.createElement("canvas"); c.width = w; c.height = h;
    draw(c.getContext("2d"), w, h);
    var t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = 8;
    if (rx) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry || rx); }
    return t;
  }
  function std(color, opts) { return new THREE.MeshStandardMaterial(Object.assign({ color: color, roughness: 0.75, metalness: 0.0 }, opts || {})); }
  var dummy = new THREE.Object3D();
  function setInst(mesh, i, x, y, z, sx, sy, sz, ry) {
    dummy.position.set(x, y, z); dummy.scale.set(sx, sy, sz); dummy.rotation.set(0, ry || 0, 0); dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix);
  }
  function add(mesh, x, y, z) { mesh.position.set(x, y, z); mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh); return mesh; }

  var GOLD = std(0xd9a62a, { metalness: 0.35, roughness: 0.35, emissive: 0x3d2606 });
  var CRIMSON = std(0x8f0a1f, { roughness: 0.65 });
  var IVORY = std(0xf4ead8, { roughness: 0.8 });

  // ---------- Textures ----------
  var texMarigold = canvasTex(256, 512, function (g, w, h) {
    g.fillStyle = "#a8130f"; g.fillRect(0, 0, w, h);
    var cols = ["#ff8a1f", "#ffb31a", "#e5541a", "#ff9f2e", "#d63a14", "#ffc23d"];
    for (var i = 0; i < 520; i++) {
      var x = Math.random() * w, y = Math.random() * h, r = 9 + Math.random() * 9;
      g.fillStyle = cols[(Math.random() * cols.length) | 0];
      g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
      g.fillStyle = "rgba(120,20,0,0.35)"; g.beginPath(); g.arc(x, y, r * 0.4, 0, 6.283); g.fill();
    }
  });
  var texPlatformSide = canvasTex(1024, 128, function (g, w, h) {
    g.fillStyle = "#5d1c2c"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "#f2e6d0"; g.fillStyle = "#f2e6d0"; g.lineWidth = 3;
    g.strokeRect(0, 10, w, h - 20);
    g.lineWidth = 1.5; g.strokeRect(0, 18, w, h - 36);
    for (var x = 32; x < w; x += 64) {
      g.beginPath(); g.moveTo(x, 34); g.lineTo(x + 22, 64); g.lineTo(x, 94); g.lineTo(x - 22, 64); g.closePath(); g.stroke();
      g.beginPath(); g.arc(x, 64, 5, 0, 6.283); g.fill();
      for (var k = -1; k <= 1; k += 2) { g.beginPath(); g.ellipse(x + k * 40, 64, 14, 6, k * 0.4, 0, 6.283); g.stroke(); }
    }
  }, 4, 1);
  var texPlatformTop = canvasTex(512, 512, function (g, w, h) {
    g.fillStyle = "#5e1d2a"; g.fillRect(0, 0, w, h);
    var gr = g.createRadialGradient(w / 2, h / 2, 20, w / 2, h / 2, w / 2);
    gr.addColorStop(0, "rgba(160,60,60,0.45)"); gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(245,225,190,0.55)"; g.lineWidth = 3;
    g.beginPath(); g.arc(w / 2, h / 2, w * 0.46, 0, 6.283); g.stroke();
    g.lineWidth = 1.5; g.beginPath(); g.arc(w / 2, h / 2, w * 0.42, 0, 6.283); g.stroke();
  });
  var texFloor = canvasTex(512, 512, function (g, w, h) {
    g.fillStyle = "#e6dccb"; g.fillRect(0, 0, w, h);
    for (var i = 0; i < 4000; i++) { g.fillStyle = "rgba(" + (150 + Math.random() * 60 | 0) + ",130,110," + Math.random() * 0.06 + ")"; g.fillRect(Math.random() * w, Math.random() * h, 3, 3); }
    g.strokeStyle = "rgba(120,95,70,0.35)"; g.lineWidth = 2;
    g.strokeRect(1, 1, w - 2, h - 2);
    g.beginPath(); g.moveTo(w / 2, 0); g.lineTo(w / 2, h); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.strokeStyle = "rgba(120,95,70,0.12)"; g.stroke();
  }, 11, 15);
  var texWall = canvasTex(256, 256, function (g, w, h) {
    for (var x = 0; x < w; x++) {
      var v = 0.5 + 0.5 * Math.sin(x / w * Math.PI * 2 * 4);
      var c = (236 + v * 14) | 0;
      g.fillStyle = "rgb(" + c + "," + (c - 14) + "," + (c - 34) + ")"; g.fillRect(x, 0, 1, h);
    }
  });

  // ---------- Open lawn, boundary wall and sky ----------
  var texGrass = canvasTex(256, 256, function (g, w, h) {
    g.fillStyle = "#4f7a35"; g.fillRect(0, 0, w, h);
    for (var i = 0; i < 6000; i++) { var l = 28 + Math.random() * 22; g.fillStyle = "hsla(" + (90 + Math.random() * 25) + ",45%," + l + "%,0.35)"; g.fillRect(Math.random() * w, Math.random() * h, 1.5, 5); }
  }, 40, 40);
  texGrass.repeat.set(220, 220);
  var lawn = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), std(0xffffff, { map: texGrass, roughness: 1 }));
  lawn.rotation.x = -Math.PI / 2; lawn.receiveShadow = true; scene.add(lawn);

  // low boundary wall around the venue, open at the entry
  (function boundary() {
    var stucco = std(0xefe6d6, { roughness: 0.85 }), capMat = std(0xf8f3ea, { roughness: 0.6 });
    var hw = HALL_W / 2, hd = HALL_D / 2, H = 0.9;
    function seg(x1, z1, x2, z2) {
      var len = Math.hypot(x2 - x1, z2 - z1), cx = (x1 + x2) / 2, cz = (z1 + z2) / 2, ry = Math.atan2(x2 - x1, z2 - z1);
      var w = new THREE.Mesh(new THREE.BoxGeometry(0.35, H, len), stucco); w.rotation.y = ry; add(w, cx, H / 2, cz);
      var c = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, len + 0.1), capMat); c.rotation.y = ry; add(c, cx, H + 0.05, cz);
    }
    var ballGeo = new THREE.SphereGeometry(0.2, 12, 10);
    function pier(x, z) {
      add(new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.25, 0.6), stucco), x, 0.625, z);
      add(new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.1, 0.72), capMat), x, 1.3, z);
      add(new THREE.Mesh(ballGeo, capMat), x, 1.55, z);
    }
    seg(-hw, -hd, hw, -hd); seg(hw, -hd, hw, hd); seg(hw, hd, -hw, hd);
    seg(-hw, hd, -hw, DOOR.z1); seg(-hw, DOOR.z0, -hw, -hd);
    for (var x = -hw; x <= hw; x += 4) { pier(x, -hd); pier(x, hd); }
    for (var z = -hd + 4; z < hd; z += 4) { pier(hw, z); if (z < DOOR.z0 - 0.5 || z > DOOR.z1 + 0.5) pier(-hw, z); }
  })();

  (function trees() {
    var tm = std(0x2c5a2a, { roughness: 1 }), trunk = std(0x5b3a22);
    for (var i = 0; i < 26; i++) {
      var side = i % 2 ? 1 : -1, z = -30 + Math.floor(i / 2) * 5 + rr(-1, 1), x = side * rr(20, 26);
      var t = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 2.2, 6), trunk); add(t, x, 1.1, z);
      var c = new THREE.Mesh(new THREE.SphereGeometry(rr(1.6, 2.4), 10, 8), tm); add(c, x, 3.6, z);
    }
  })();

  // entry arch on the left, where the arrow in the sketch points in
  (function entryArch() {
    var zA = DOOR.z0, zB = DOOR.z1, x = -HALL_W / 2, h = 3.8;
    add(new THREE.Mesh(new THREE.BoxGeometry(0.5, h, 0.5), CRIMSON), x, h / 2, zA);
    add(new THREE.Mesh(new THREE.BoxGeometry(0.5, h, 0.5), CRIMSON), x, h / 2, zB);
    add(new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.5, zB - zA + 1), CRIMSON), x, h + 0.25, (zA + zB) / 2);
    add(new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.1, zB - zA + 1), GOLD), x, h - 0.05, (zA + zB) / 2);
    var n = 30 * 7, im = new THREE.InstancedMesh(new THREE.SphereGeometry(0.07, 7, 5), std(0xffffff, { roughness: 0.9 }), n), c = new THREE.Color(), q = 0;
    for (var i = 0; i < 30; i++) {
      var zz = zA - 0.3 + (zB - zA + 0.6) * i / 29, len = 4 + (rnd() * 3 | 0);
      for (var j = 0; j < 7; j++) {
        if (j >= len) { setInst(im, q, 0, -9, 0, 0.001, 0.001, 0.001); q++; continue; }
        setInst(im, q, x + rr(-0.03, 0.03), h - 0.25 - j * 0.14, zz, 1, 0.85, 1);
        c.set([0xe8700f, 0xf5a21a, 0xd2490d][(rnd() * 3) | 0]); im.setColorAt(q, c); q++;
      }
    }
    scene.add(im);
  })();

  // sky dome with the sun setting behind the stage
  var sunDir = new THREE.Vector3(-0.12, 0.09, -1).normalize();
  var skyU = { uDusk: { value: 0 }, uSun: { value: sunDir.clone() } };
  var sky = new THREE.Mesh(new THREE.SphereGeometry(500, 48, 24), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
    vertexShader: "varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    fragmentShader: [
      "varying vec3 vD; uniform float uDusk; uniform vec3 uSun;",
      "void main(){",
      "  vec3 d = normalize(vD); float h = clamp(d.y, 0.0, 1.0);",
      "  vec3 zen = mix(vec3(0.22,0.33,0.58), vec3(0.047,0.078,0.157), uDusk);",
      "  vec3 mid = mix(vec3(0.93,0.52,0.42), vec3(0.12,0.09,0.20), uDusk);",
      "  vec3 hor = mix(vec3(1.00,0.72,0.36), vec3(0.30,0.15,0.20), uDusk);",
      "  vec3 c = mix(hor, mid, smoothstep(0.0, 0.18, h));",
      "  c = mix(c, zen, smoothstep(0.12, 0.8, h));",
      "  float s = max(dot(d, uSun), 0.0);",
      "  c += vec3(1.0,0.62,0.25) * pow(s, 8.0) * mix(0.9, 0.18, uDusk);",
      "  c += vec3(1.0,0.85,0.55) * pow(s, 120.0) * 0.9 * (1.0 - uDusk);",
      "  c += vec3(1.0,0.95,0.8) * smoothstep(0.9993, 0.9998, s) * (1.0 - uDusk);",
      "  if (d.y < 0.0) c = mix(hor * 0.9, mix(vec3(0.35,0.28,0.34), vec3(0.07,0.047,0.11), uDusk), clamp(-d.y * 6.0, 0.0, 1.0));",
      "  gl_FragColor = vec4(c, 1.0);",
      "}"
    ].join("\n")
  }));
  scene.add(sky);

  // sunset clouds
  var cloudMats = [];
  (function distant() {
    var cloud = canvasTex(256, 64, function (g) { var gr = g.createRadialGradient(128, 32, 4, 128, 32, 128); gr.addColorStop(0, "rgba(255,170,120,0.8)"); gr.addColorStop(1, "rgba(255,150,110,0)"); g.save(); g.scale(1, 0.25); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); g.restore(); });
    for (var i = 0; i < 9; i++) {
      var cm = new THREE.Mesh(new THREE.PlaneGeometry(rr(90, 170), rr(10, 22)), new THREE.MeshBasicMaterial({ map: cloud, transparent: true, depthWrite: false, fog: false, opacity: rr(0.5, 0.95) })); cm.material.userData.base = cm.material.opacity; cloudMats.push(cm.material);
      cm.position.set(rr(-200, 200), rr(25, 90), -rr(200, 330)); cm.lookAt(0, cm.position.y, 0); scene.add(cm);
    }
  })();

  // ---------- Aisle carpet and aisle petals ----------
  (function aisle() {
    var carpet = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 24.4), std(0x7d0c1d, { roughness: 1 }));
    carpet.rotation.x = -Math.PI / 2; carpet.position.set(0, 0.012, 14 - 12.2 + 0.0); carpet.position.z = 1.8; carpet.receiveShadow = true; scene.add(carpet);
    // gold edging
    [-1.3, 1.3].forEach(function (x) {
      var e = new THREE.Mesh(new THREE.PlaneGeometry(0.1, 24.4), std(0xd9a62a, { roughness: 0.6 }));
      e.rotation.x = -Math.PI / 2; e.position.set(x, 0.014, 1.8); scene.add(e);
    });
    // marigold line along the aisle
    var n = 2 * 33;
    var geo = new THREE.SphereGeometry(0.11, 8, 6);
    var im = new THREE.InstancedMesh(geo, std(0xffffff, { roughness: 0.8 }), n);
    var col = new THREE.Color(); var i = 0;
    [-1.55, 1.55].forEach(function (x) {
      for (var k = 0; k < 33; k++) {
        setInst(im, i, x + rr(-0.07, 0.07), 0.1, 13.5 - k * 0.64 + rr(-0.1, 0.1), 1, 0.8, 1);
        col.set(k % 4 === 3 ? 0xffffff : (k % 2 ? 0xff8a1f : 0xffb31a)); im.setColorAt(i, col); i++;
      }
    });
    im.castShadow = true; scene.add(im);
  })();

  // ---------- Guest seating ----------
  (function seating() {
    var cols = 6, rows = 10, blocks = 2, n = cols * rows * blocks;
    var seat = new THREE.InstancedMesh(new THREE.BoxGeometry(0.5, 0.07, 0.5), IVORY, n);
    var backr = new THREE.InstancedMesh(new THREE.BoxGeometry(0.5, 0.62, 0.05), GOLD, n);
    var legs = new THREE.InstancedMesh(new THREE.BoxGeometry(0.04, 0.46, 0.04), GOLD, n * 4);
    var sash = new THREE.InstancedMesh(new THREE.BoxGeometry(0.12, 0.5, 0.03), CRIMSON, n);
    var i = 0, l = 0;
    for (var b = 0; b < blocks; b++) {
      var sgn = b === 0 ? -1 : 1;
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {

  }

  function buildTuberosePlantersAndFoliage() {

  }

  buildMandapStageAndSteps();

  // The design's colours were picked for a non-sRGB renderer; convert once so they read the same here.
  (function matchColours() {
    var seen = new Set();
    M.traverse(function (o) {
      var mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];

        if (seen.has(m)) return; seen.add(m);

      });
    });
  })();

  // ---------- String lights on poles around the seating ----------
  var fairy;
  (function lights() {

    P.forEach(function (p) { add(new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 4.4, 6), poleMat), p[0], 2.2, p[1]); });

    var geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
    var sprite = canvasTex(64, 64, function (g) {
      var gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, "rgba(255,240,200,1)"); gr.addColorStop(0.3, "rgba(255,200,120,0.55)"); gr.addColorStop(1, "rgba(255,180,80,0)");

    scene.add(fairy);
  })();

  // ---------- Lighting rig ----------
  scene.fog = new THREE.Fog(0xf0b58a, 90, 420);
  var hemi = new THREE.HemisphereLight(0xffd7b0, 0x4a5a35, 0.35); scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xff9a45, 2.0); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  var sc = sun.shadow.camera; sc.left = -24; sc.right = 24; sc.top = 24; sc.bottom = -24; sc.near = 1; sc.far = 220; sun.shadow.bias = -0.0006;
  scene.add(sun); scene.add(sun.target);
  var fill = new THREE.DirectionalLight(0xffc7a0, 0.45); fill.position.set(6, 10, 40); scene.add(fill);
  var moon = new THREE.DirectionalLight(0x8da9fc, 0); moon.position.set(10, 25, -10); scene.add(moon);
  var ambient = new THREE.AmbientLight(0xfff6eb, 0); scene.add(ambient);
  var FOG_SUNSET = new THREE.Color(0xf0b58a), FOG_EVENING = new THREE.Color(0x1d1629).convertSRGBToLinear();
  var mandapLight = new THREE.PointLight(0xffc27a, 0.6, 18, 1.6); mandapLight.position.set(0, 5.5, PZ + 2); scene.add(mandapLight);
  var spotL = { intensity: 0 };

  // ---------- Labels ----------
  var labelSprites = [];
  function label(text, x, y, z, scale) {

    g.beginPath(); g.moveTo(256 - w / 2 + 20, 24); g.lineTo(256 + w / 2 - 20, 24); g.quadraticCurveTo(256 + w / 2, 24, 256 + w / 2, 44); g.lineTo(256 + w / 2, 84); g.quadraticCurveTo(256 + w / 2, 104, 256 + w / 2 - 20, 104); g.lineTo(256 - w / 2 + 20, 104); g.quadraticCurveTo(256 - w / 2, 104, 256 - w / 2, 84); g.lineTo(256 - w / 2, 44); g.quadraticCurveTo(256 - w / 2, 24, 256 - w / 2 + 20, 24); g.fill(); g.stroke();

  }
  label("STAGE", 0, 9.3, PZ, 1.0);

  label("ENTRY", -16, 4.8, 15.5, 0.9);

  // entry arrow on the floor
  (function arrow() {

    var m = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color: 0xffa31f, transparent: true, opacity: 0.85 }));
    m.rotation.x = -Math.PI / 2; m.position.set(-19.5, 0.03, 15.5); scene.add(m); labelSprites.push(m);
  })();

  // ---------- Camera presets and animation ----------
  var VIEWS = {
    overview: { p: [0, 12, 34], t: [0, 3, -12] },
    entry: { p: [-14.4, 1.7, 15.5], t: [0, 2.6, -10] },

    canopy: { p: [0, 1.9, -11.6], t: [0, 6.2, -14.2] },

  };
  var fly = null, tour = null, spin = false;
  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function flyTo(v, dur) {

    fly = { t0: performance.now(), dur: (dur || 1.6) * 1000, p0: camera.position.clone(), t0v: controls.target.clone(), p1: new THREE.Vector3().fromArray(v.p), t1: new THREE.Vector3().fromArray(v.t) };
  }
  var tourPos = new THREE.CatmullRomCurve3([[-14.8, 1.7, 15.5], [-9, 1.7, 15], [-2, 1.7, 12.5], [0, 1.7, 8], [0, 1.9, 0], [0, 2.3, -6], [0, 2.6, -8.2]].map(function (a) { return new THREE.Vector3().fromArray(a); }));
  var tourTgt = new THREE.CatmullRomCurve3([[-8, 1.7, 15.2], [0, 1.9, 10], [0, 2.6, 0], [0, 3.4, -10], [0, 3.8, -14], [0, 3.8, -14], [0, 3.9, -14]].map(function (a) { return new THREE.Vector3().fromArray(a); }));
  function startTour() { fly = null; tour = { t0: performance.now(), dur: 26000 }; }

  var viewBtns = Array.prototype.slice.call(document.querySelectorAll("#views button"));

    });
  });
  camera.position.fromArray(VIEWS.overview.p); controls.target.fromArray(VIEWS.overview.t); controls.update();

  // ---------- Options ----------
  var night = true, nightAmt = 1;
  var tSunset = document.getElementById("tSunset"), tEvening = document.getElementById("tEvening"), tLabels = document.getElementById("tLabels"), tSpin = document.getElementById("tSpin");
  function setEvening(on) { night = on; tEvening.setAttribute("aria-pressed", String(on)); tSunset.setAttribute("aria-pressed", String(!on)); }
  tSunset.addEventListener("click", function () { setEvening(false); });
  tEvening.addEventListener("click", function () { setEvening(true); });
  tLabels.addEventListener("click", function () { var on = tLabels.getAttribute("aria-pressed") !== "true"; tLabels.setAttribute("aria-pressed", String(on)); labelSprites.forEach(function (s) { s.visible = on; }); });
  tSpin.addEventListener("click", function () { spin = !spin; tSpin.setAttribute("aria-pressed", String(spin)); if (spin) { fly = null; tour = null; setActive(null); } });
  var optToggle = document.getElementById("optToggle"), opts = document.getElementById("options");
  if (window.matchMedia("(max-width: 720px)").matches) { opts.classList.add("closed"); optToggle.setAttribute("aria-expanded", "false"); }
  optToggle.addEventListener("click", function () { var c = opts.classList.toggle("closed"); optToggle.setAttribute("aria-expanded", String(!c)); });

  // ---------- Floor-plan map (mirrors the sketch) ----------
  var mapC = document.getElementById("mapCanvas"), mg = mapC.getContext("2d");
  function mx(x) { return (x + HALL_W / 2) / HALL_W * mapC.width; }
  function mz(z) { return (z + HALL_D / 2) / HALL_D * mapC.height; }
  function drawMap() {
    var W = mapC.width, H = mapC.height;
    mg.clearRect(0, 0, W, H);
    mg.strokeStyle = "rgba(255,200,130,0.8)"; mg.lineWidth = 3; mg.strokeRect(2, 2, W - 4, H - 4);
    mg.clearRect(0, mz(DOOR.z0), 8, mz(DOOR.z1) - mz(DOOR.z0));
    mg.fillStyle = "rgba(200,16,46,0.55)"; mg.fillRect(mx(-5.3), mz(PZ - 4.2), mx(5.3) - mx(-5.3), mz(PZ + 4.2) - mz(PZ - 4.2)); mg.strokeRect(mx(-5.3), mz(PZ - 4.2), mx(5.3) - mx(-5.3), mz(PZ + 4.2) - mz(PZ - 4.2));
    mg.fillStyle = "rgba(244,234,216,0.35)"; mg.fillRect(mx(-8), mz(-2.6), mx(8) - mx(-8), mz(9.4) - mz(-2.6)); mg.lineWidth = 2; mg.strokeRect(mx(-8), mz(-2.6), mx(8) - mx(-8), mz(9.4) - mz(-2.6));
    mg.fillStyle = "#ffcf85"; mg.font = "20px sans-serif"; mg.textAlign = "center";
    mg.fillText("stage", mx(0), mz(STAGE.z) + 7); mg.fillText("sitting", mx(0), mz(3.4) + 7); mg.fillText("entry ➜", mx(-9.5), mz(16) + 4);
    // camera marker with look direction
    var x = mx(camera.position.x), z = mz(camera.position.z);
    var dir = new THREE.Vector3(); camera.getWorldDirection(dir);
    var ang = Math.atan2(dir.z, dir.x);
    mg.fillStyle = "#ffa31f";
    mg.beginPath(); mg.moveTo(x, z); mg.arc(x, z, 36, ang - 0.45, ang + 0.45); mg.closePath(); mg.globalAlpha = 0.45; mg.fill(); mg.globalAlpha = 1;
    mg.beginPath(); mg.arc(x, z, 6, 0, 6.283); mg.fill();
  }

  // ---------- Resize + loop ----------
  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
  });
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var lastT = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (fly) {
      var k = Math.min(1, (now - fly.t0) / (reduce ? 1 : fly.dur)), e = ease(k);
      camera.position.lerpVectors(fly.p0, fly.p1, e); controls.target.lerpVectors(fly.t0v, fly.t1, e);
      if (k >= 1) fly = null;
    } else if (tour) {
      var u = Math.min(1, (now - tour.t0) / tour.dur), ue = u < 0.05 ? u * u * 10 : u;
      camera.position.copy(tourPos.getPoint(Math.min(1, ue))); controls.target.copy(tourTgt.getPoint(Math.min(1, ue)));
      if (u >= 1) tour = null;
    } else if (spin) {

    var goal = night ? 1 : 0; nightAmt += (goal - nightAmt) * Math.min(1, dt * 2.5);
    var na = nightAmt;
    skyU.uDusk.value = na;
    var el = 0.09 - 0.17 * na; sunDir.set(-0.12, el, -1).normalize(); skyU.uSun.value.copy(sunDir);
    sun.position.copy(sunDir).multiplyScalar(110).add(new THREE.Vector3(0, 0, -10)); if (el < 0.02) sun.position.y = 2.5 + (el + 0.08) * 40;
    sun.intensity = 2.0 * (1 - na); hemi.intensity = 0.35 - 0.27 * na;
    fill.intensity = 0.45 * (1 - na); moon.intensity = 0.38 * na; ambient.intensity = 0.1 * na;
    cloudMats.forEach(function (m) { m.opacity = m.userData.base * (1 - 0.75 * na); });
    scene.environment = na > 0.5 ? envEvening : envSunset;

    renderer.toneMappingExposure = 0.85 + 0.2 * na;
    fairy.material.opacity = 0.45 + 0.5 * na; fairy.material.size = 0.35 + 0.12 * na;

    var el2 = now / 1000;
    chandelierStrands.forEach(function (st) { st.group.rotation.z = Math.sin(el2 * 1.6 + st.phaseX) * st.amp; st.group.rotation.x = Math.cos(el2 * 1.25 + st.phaseZ) * st.amp * 0.7; });
    bellStrands.forEach(function (b) { b.group.rotation.z = Math.sin(el2 * 2.1 + b.phase) * b.amp; b.group.rotation.x = Math.cos(el2 * 1.7 + b.phase) * b.amp * 0.65; });
    swayingFoliage.forEach(function (r) { r.mesh.rotation.z = r.baseRotZ + Math.sin(el2 * 1.9 + r.phase) * 0.045; });
    havanFlames.forEach(function (f) { var sy = 0.85 + Math.sin(el2 * 11 + f.phase) * 0.28, sxz = 0.9 + Math.cos(el2 * 9 + f.phase) * 0.15; f.mesh.scale.set(sxz, sy, sxz); f.mesh.rotation.z = Math.sin(el2 * 6.5 + f.phase) * 0.14; });
    havanLight.intensity = (1.25 + Math.sin(el2 * 14) * 0.25 + Math.cos(el2 * 23) * 0.15) * (1 + na);
    lampLights.forEach(function (l) { l.intensity = 0.45 + 1.4 * na; });

    renderer.render(scene, camera);
    drawMap();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(function () { document.getElementById("loading").classList.add("done"); }, 350);
})();
