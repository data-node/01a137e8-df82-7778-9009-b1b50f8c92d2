<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Explore an interactive 3D panoramic wedding stage with floral details, chandeliers, sunset and evening lighting, and a guided venue tour.">
<title>Grand Panoramic Wedding Stage 3D</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600&display=swap">
<style>
  /* Layout: full-bleed 3D canvas; title top-left, controls right, view bar bottom, floor-plan map bottom-left */
  :root {
    --bg: #0c0814;
    --panel: rgba(18, 14, 28, 0.80);
    --line: rgba(240, 195, 130, 0.24);
    --fg: #fbeedd;
    --muted: #c9b8d2;
    --marigold: #f5b642;
    --crimson: #d43f7d;
    --display: "Marcellus", "Palatino Linotype", Georgia, serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; overflow: hidden; }
  #stage3d { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #title { box-sizing: border-box; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 16px; padding: 12px 16px; max-width: calc(100vw - 450px); }
  #title h1 { margin: 0; font: 400 22px/1.1 var(--display); letter-spacing: 0.02em; color: var(--marigold); }
  #title p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

  #options { top: calc(env(safe-area-inset-top, 0px) + 12px); right: 16px; width: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  #options input[type="text"] { background: rgba(255,255,255,0.06); border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 7px 9px; font: 14px var(--body); min-width: 0; }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px; }
  .toggles button { flex: 1 1 auto; }
  #optToggle { display: none; }

  button { font: 500 13px var(--body); color: var(--fg); background: rgba(255,255,255,0.07); border: 1px solid var(--line); border-radius: 7px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
  button:hover { background: rgba(245,182,66,0.18); }
  button[aria-pressed="true"], button.active { background: var(--marigold); color: #241404; border-color: var(--marigold); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--marigold); outline-offset: 2px; }

  #views { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; gap: 6px; padding: 8px; max-width: calc(100vw - 32px); overflow-x: auto; }
  #map { left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); padding: 6px; }
  #map canvas { display: block; width: 104px; height: 143px; }
  #hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 68px); color: var(--muted); font-size: 12px; text-shadow: 0 1px 4px #000; pointer-events: none; text-align: center; width: max-content; max-width: calc(100vw - 32px); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); font: 22px var(--display); color: var(--marigold); transition: opacity .6s; }
  #loading.done { opacity: 0; pointer-events: none; }

  @media (max-width: 720px) {
    #optToggle { display: block; position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 16px; }
    #options { top: calc(env(safe-area-inset-top, 0px) + 56px); max-width: calc(100vw - 60px); max-height: calc(100dvh - 160px); overflow-y: auto; }
    #options.closed { display: none; }
    #title { max-width: calc(100vw - 120px); padding: 8px 12px; }
    #title h1 { font-size: 17px; }
    #title p { display: none; }
    #map { display: none; }
    #hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { #loading { transition: none; } }
</style>

</head>
<body>
<div id="stage3d"></div>

<div id="title" class="panel">
  <h1>Grand Floral Reception Stage</h1>
  <p>5-bay panoramic backdrop &middot; drag to look around</p>
</div>

<button id="optToggle" aria-expanded="true">Options</button>
<div id="options" class="panel">
  <div class="toggles">
    <button id="tSunset" aria-pressed="false">Sunset</button>
    <button id="tEvening" aria-pressed="true">Evening glow</button>
    <button id="tLabels" aria-pressed="true">Labels</button>
    <button id="tSpin" aria-pressed="false">Spin</button>
  </div>
</div>

<div id="map" class="panel"><canvas id="mapCanvas" width="208" height="286" aria-label="Floor plan"></canvas></div>

<div id="hint">Pick a view below</div>
<div id="views" class="panel" role="group" aria-label="Camera views">
  <button data-view="overview" class="active">Overview</button>
  <button data-view="entry">From entry</button>
  <button data-view="guest">Aisle view</button>
  <button data-view="stage">Center sofa</button>
  <button data-view="leftWing">Left wing</button>
  <button data-view="rightWing">Right wing</button>
  <button data-view="canopy">Chandeliers</button>
  <button data-view="top">Floor plan</button>
  <button data-view="tour">Walk-in tour</button>
</div>

<div id="loading">Setting up the venue&hellip;</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script>
(function () {
  "use strict";

  // ---------- Venue dimensions (metres) ----------
  // Hall 34 x 44. Wide 5-bay panoramic stage at the back (-z), yellow aisle in the middle, entry on the left wall near the front (+z).
  var HALL_W = 34, HALL_D = 44, HALL_H = 10;
  var STAGE = { x: 0, z: -14, w: 22.8, d: 5.4, h: 1.04 };
  var DOOR = { z0: 13.5, z1: 17.5, h: 4.6 };

  var rngSeed = 19;
  function rnd() { rngSeed |= 0; rngSeed = rngSeed + 0x6D2B79F5 | 0; var t = Math.imul(rngSeed ^ rngSeed >>> 15, 1 | rngSeed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
  function rr(a, b) { return a + rnd() * (b - a); }

  // ---------- Renderer, scene, camera ----------
  var host = document.getElementById("stage3d");
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.85;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  host.appendChild(renderer.domElement);

  var scene = new THREE.Scene();

  var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1500);
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 1.5;
  controls.maxDistance = 95;
  controls.maxPolarAngle = Math.PI * 0.505;

  // Reflection environments for metallic silver sofa carvings, mirrored consoles, and gold chandeliers
  var envSunset, envEvening;
  (function environments() {
    function make(top, hor, ground) {
      var envScene = new THREE.Scene(), geo = new THREE.SphereGeometry(10, 32, 16), cols = [], pos = geo.attributes.position, c = new THREE.Color();
      for (var i = 0; i < pos.count; i++) {
        var y = pos.getY(i) / 10;
        if (y > 0) c.copy(hor).lerp(top, Math.min(1, y * 1.6)); else c.copy(ground);
        cols.push(c.r, c.g, c.b);
      }
      geo.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3));
      envScene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true })));
      var pm = new THREE.PMREMGenerator(renderer), t = pm.fromScene(envScene, 0.04).texture; pm.dispose(); return t;
    }
    envSunset = make(new THREE.Color(0.35, 0.42, 0.65), new THREE.Color(0.92, 0.64, 0.48), new THREE.Color(0.25, 0.28, 0.18));
    envEvening = make(new THREE.Color(0.02, 0.03, 0.08), new THREE.Color(0.18, 0.14, 0.24), new THREE.Color(0.04, 0.04, 0.05));
    scene.environment = envEvening;
  })();

  // ---------- Helpers ----------
  function canvasTex(w, h, draw, rx, ry) {
    var c = document.createElement("canvas"); c.width = w; c.height = h;
    draw(c.getContext("2d"), w, h);
    var t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = 8;
    if (rx) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry || rx); }
    return t;
  }
  function std(color, opts) { return new THREE.MeshStandardMaterial(Object.assign({ color: color, roughness: 0.75, metalness: 0.0 }, opts || {})); }
  var dummy = new THREE.Object3D();
  function setInst(mesh, i, x, y, z, sx, sy, sz, ry, rx, rz) {
    dummy.position.set(x, y, z);
    dummy.scale.set(sx, sy, sz);
    dummy.rotation.set(rx || 0, ry || 0, rz || 0);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  function add(mesh, x, y, z) { mesh.position.set(x, y, z); mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh); return mesh; }

  var GOLD = std(0xe5b84b, { metalness: 0.78, roughness: 0.26, emissive: 0x2a1c04 });
  var SILVER = std(0xd8dde6, { metalness: 0.82, roughness: 0.22 });
  var CRIMSON = std(0xa81c4d, { roughness: 0.65 });
  var IVORY = std(0xf7f3eb, { roughness: 0.75 });

  // ---------- Open lawn, boundary wall, geometric venue carpet & sky ----------
  var texGrass = canvasTex(256, 256, function (g, w, h) {
    g.fillStyle = "#355828"; g.fillRect(0, 0, w, h);
    for (var i = 0; i < 6000; i++) { var l = 24 + Math.random() * 20; g.fillStyle = "hsla(" + (92 + Math.random() * 25) + ",42%," + l + "%,0.35)"; g.fillRect(Math.random() * w, Math.random() * h, 1.5, 5); }
  }, 40, 40);
  texGrass.repeat.set(220, 220);
  var lawn = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), std(0xffffff, { map: texGrass, roughness: 1 }));
  lawn.rotation.x = -Math.PI / 2; lawn.receiveShadow = true; scene.add(lawn);

  // Patterned hexagonal/geometric banquet carpet covering the venue floor (matching the foreground floor in the photos)
  var texBanquetCarpet = canvasTex(512, 512, function (g, w, h) {
    g.fillStyle = "#6c2428"; g.fillRect(0, 0, w, h);
    var palette = ["#9e332e", "#c95b36", "#d99242", "#e2C496", "#541924", "#7c2c38", "#b5483a"];
    var rows = 8, cols = 8, cw = w / cols, ch = h / rows;
    for (var r = 0; r <= rows; r++) {
      for (var c = 0; c <= cols; c++) {
        var cx = c * cw + (r % 2 ? cw * 0.5 : 0), cy = r * ch;
        var rad = cw * 0.56;
        g.fillStyle = palette[(r * 3 + c * 5) % palette.length];
        g.beginPath();
        for (var k = 0; k < 6; k++) {
          var ang = k * Math.PI / 3 + Math.PI / 6;
          var px = cx + Math.cos(ang) * rad, py = cy + Math.sin(ang) * rad;
          if (k === 0) g.moveTo(px, py); else g.lineTo(px, py);
        }
        g.closePath(); g.fill();
        g.strokeStyle = "rgba(245, 220, 185, 0.38)"; g.lineWidth = 2.5; g.stroke();
        g.fillStyle = palette[(r + c * 2 + 3) % palette.length];
        g.beginPath(); g.arc(cx, cy, rad * 0.42, 0, Math.PI * 2); g.fill();
      }
    }
  }, 10, 13);
  var venueCarpet = new THREE.Mesh(new THREE.PlaneGeometry(HALL_W - 0.8, HALL_D - 0.8), std(0xffffff, { map: texBanquetCarpet, roughness: 0.92 }));
  venueCarpet.rotation.x = -Math.PI / 2; venueCarpet.position.set(0, 0.008, 0); venueCarpet.receiveShadow = true; scene.add(venueCarpet);

  // Low boundary wall around the venue, open at the entry
  (function boundary() {
    var stucco = std(0xefe6d6, { roughness: 0.85 }), capMat = std(0xf8f3ea, { roughness: 0.6 });
    var hw = HALL_W / 2, hd = HALL_D / 2, H = 0.95;
    function seg(x1, z1, x2, z2) {
      var len = Math.hypot(x2 - x1, z2 - z1), cx = (x1 + x2) / 2, cz = (z1 + z2) / 2, ry = Math.atan2(x2 - x1, z2 - z1);
      var w = new THREE.Mesh(new THREE.BoxGeometry(0.35, H, len), stucco); w.rotation.y = ry; add(w, cx, H / 2, cz);
      var c = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, len + 0.1), capMat); c.rotation.y = ry; add(c, cx, H + 0.05, cz);
    }
    var ballGeo = new THREE.SphereGeometry(0.2, 12, 10);
    function pier(x, z) {
      add(new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.25, 0.6), stucco), x, 0.625, z);
      add(new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.1, 0.72), capMat), x, 1.3, z);
      add(new THREE.Mesh(ballGeo, capMat), x, 1.55, z);
    }
    seg(-hw, -hd, hw, -hd); seg(hw, -hd, hw, hd); seg(hw, hd, -hw, hd);
    seg(-hw, hd, -hw, DOOR.z1); seg(-hw, DOOR.z0, -hw, -hd);
    for (var x = -hw; x <= hw; x += 4.25) { pier(x, -hd); pier(x, hd); }
    for (var z = -hd + 4.4; z < hd; z += 4.4) { pier(hw, z); if (z < DOOR.z0 - 0.5 || z > DOOR.z1 + 0.5) pier(-hw, z); }
  })();

  (function trees() {
    var tm = std(0x234922, { roughness: 1 }), trunk = std(0x4e321d);
    for (var i = 0; i < 28; i++) {
      var side = i % 2 ? 1 : -1, z = -30 + Math.floor(i / 2) * 4.8 + rr(-1, 1), x = side * rr(21, 28);
      var t = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 2.4, 6), trunk); add(t, x, 1.2, z);
      var c = new THREE.Mesh(new THREE.SphereGeometry(rr(1.7, 2.5), 10, 8), tm); add(c, x, 3.8, z);
    }
  })();

  // Entry arch on the left with pink, white & blue floral header matching the stage
  (function entryArch() {
    var zA = DOOR.z0, zB = DOOR.z1, x = -HALL_W / 2, h = 3.9;
    add(new THREE.Mesh(new THREE.BoxGeometry(0.5, h, 0.5), IVORY), x, h / 2, zA);
    add(new THREE.Mesh(new THREE.BoxGeometry(0.5, h, 0.5), IVORY), x, h / 2, zB);
    add(new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.52, zB - zA + 1), IVORY), x, h + 0.25, (zA + zB) / 2);
    add(new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.1, zB - zA + 1), GOLD), x, h - 0.05, (zA + zB) / 2);
    var n = 160, im = new THREE.InstancedMesh(new THREE.SphereGeometry(0.14, 7, 6), std(0xffffff, { roughness: 0.8 }), n), c = new THREE.Color();
    var cols = [0xf4dce6, 0xec6aa0, 0xc82368, 0x62b4f5, 0xffffff];
    for (var i = 0; i < n; i++) {
      var zz = zA - 0.4 + (zB - zA + 0.8) * rnd();
      var yy = h + rr(-0.1, 0.48);
      var xx = x + rr(-0.38, 0.38);
      setInst(im, i, xx, yy, zz, rr(0.8, 1.3), rr(0.8, 1.2), rr(0.8, 1.3));
      c.setHex(cols[(rnd() * cols.length) | 0]); im.setColorAt(i, c);
    }
    scene.add(im);
  })();

  // Sky dome with sunset / night transition
  var sunDir = new THREE.Vector3(-0.12, 0.09, -1).normalize();
  var skyU = { uDusk: { value: 1 }, uSun: { value: sunDir.clone() } };
  var sky = new THREE.Mesh(new THREE.SphereGeometry(500, 48, 24), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
    vertexShader: "varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    fragmentShader: [
      "varying vec3 vD; uniform float uDusk; uniform vec3 uSun;",
      "void main(){",
      "  vec3 d = normalize(vD); float h = clamp(d.y, 0.0, 1.0);",
      "  vec3 zen = mix(vec3(0.22,0.33,0.58), vec3(0.025,0.035,0.075), uDusk);",
      "  vec3 mid = mix(vec3(0.93,0.52,0.42), vec3(0.06,0.05,0.12), uDusk);",
      "  vec3 hor = mix(vec3(1.00,0.72,0.36), vec3(0.14,0.09,0.18), uDusk);",
      "  vec3 c = mix(hor, mid, smoothstep(0.0, 0.18, h));",
      "  c = mix(c, zen, smoothstep(0.12, 0.8, h));",
      "  float s = max(dot(d, uSun), 0.0);",
      "  c += vec3(1.0,0.62,0.25) * pow(s, 8.0) * mix(0.9, 0.12, uDusk);",
      "  c += vec3(1.0,0.85,0.55) * pow(s, 120.0) * 0.9 * (1.0 - uDusk);",
      "  c += vec3(1.0,0.95,0.8) * smoothstep(0.9993, 0.9998, s) * (1.0 - uDusk);",
      "  if (d.y < 0.0) c = mix(hor * 0.9, mix(vec3(0.35,0.28,0.34), vec3(0.04,0.03,0.07), uDusk), clamp(-d.y * 6.0, 0.0, 1.0));",
      "  gl_FragColor = vec4(c, 1.0);",
      "}"
    ].join("\n")
  }));
  scene.add(sky);

  // Sunset clouds
  var cloudMats = [];
  (function distant() {
    var cloud = canvasTex(256, 64, function (g) { var gr = g.createRadialGradient(128, 32, 4, 128, 32, 128); gr.addColorStop(0, "rgba(255,170,120,0.8)"); gr.addColorStop(1, "rgba(255,150,110,0)"); g.save(); g.scale(1, 0.25); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); g.restore(); });
    for (var i = 0; i < 9; i++) {
      var cm = new THREE.Mesh(new THREE.PlaneGeometry(rr(90, 170), rr(10, 22)), new THREE.MeshBasicMaterial({ map: cloud, transparent: true, depthWrite: false, fog: false, opacity: rr(0.5, 0.95) })); cm.material.userData.base = cm.material.opacity; cloudMats.push(cm.material);
      cm.position.set(rr(-200, 200), rr(25, 90), -rr(200, 330)); cm.lookAt(0, cm.position.y, 0); scene.add(cm);
    }
  })();

  // ---------- Golden-Yellow Aisle Runner & Blue/Pink/White Floral Hedges ----------
  (function aisleAndFloralHedges() {
    var aisleZ0 = -10.55, aisleZ1 = 16.8, aisleLen = aisleZ1 - aisleZ0, aisleCenterZ = (aisleZ0 + aisleZ1) / 2;
    var texYellowRunner = canvasTex(512, 1024, function (g, w, h) {
      var gr = g.createLinearGradient(0, 0, w, 0);
      gr.addColorStop(0, "#c59612"); gr.addColorStop(0.5, "#e2b422"); gr.addColorStop(1, "#c59612");
      g.fillStyle = gr; g.fillRect(0, 0, w, h);
      // Horizontal panel seam lines clearly visible on the yellow aisle runner in the photos
      for (var y = 64; y < h; y += 110) {
        g.fillStyle = "rgba(110, 78, 6, 0.42)"; g.fillRect(0, y, w, 3);
        g.fillStyle = "rgba(255, 232, 130, 0.35)"; g.fillRect(0, y + 3, w, 2);
      }
    }, 1, 3);

    var carpet = new THREE.Mesh(new THREE.PlaneGeometry(3.4, aisleLen), std(0xffffff, { map: texYellowRunner, roughness: 0.46, metalness: 0.08 }));
    carpet.rotation.x = -Math.PI / 2; carpet.position.set(0, 0.016, aisleCenterZ); carpet.receiveShadow = true; scene.add(carpet);

    // Dense low floral hedges along both sides of the yellow aisle (icy blue hydrangeas, white roses, blush pink & deep magenta accents)
    var foliageBaseMat = std(0x284e3a, { roughness: 0.9 });
    [-1.82, 1.82].forEach(function (hx) {
      var baseStrip = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.22, aisleLen), foliageBaseMat);
      baseStrip.position.set(hx, 0.11, aisleCenterZ); baseStrip.castShadow = true; baseStrip.receiveShadow = true; scene.add(baseStrip);
    });

    var bloomCount = 1900;
    var bloomGeo = new THREE.DodecahedronGeometry(0.115, 1);
    var bloomInst = new THREE.InstancedMesh(bloomGeo, std(0xffffff, { roughness: 0.68 }), bloomCount);
    var leafGeo = new THREE.ConeGeometry(0.08, 0.28, 5);
    var leafInst = new THREE.InstancedMesh(leafGeo, std(0x4888a8, { roughness: 0.75 }), 700);
    var col = new THREE.Color();
    // Palette dominated by sky-blue/cyan hydrangeas, white, soft pink, and deep magenta-purple just like the photos
    var aislePalette = [
      0x49b6ff, 0x68c6ff, 0x3298e8, 0x8ad6ff, // icy / sky blue blooms
      0xf7f9fc, 0xfff5f8,                     // crisp white
      0xf29bc2, 0xe06098,                     // rose pink
      0x6b1d5c, 0x9c2468                      // deep purple / magenta accents
    ];
    for (var i = 0; i < bloomCount; i++) {
      var side = i % 2 === 0 ? -1 : 1;
      var zPos = aisleZ0 + rnd() * aisleLen;
      var xPos = side * (1.82 + rr(-0.34, 0.34));
      var yPos = 0.12 + rr(0, 0.28) * (1 - Math.abs(xPos - side * 1.82) * 1.2);
      setInst(bloomInst, i, xPos, Math.max(0.09, yPos), zPos, rr(0.75, 1.45), rr(0.7, 1.25), rr(0.75, 1.45), rnd() * 6.28, rr(-0.4, 0.4), rr(-0.4, 0.4));
      col.setHex(aislePalette[(rnd() * aislePalette.length) | 0]).convertSRGBToLinear();
      bloomInst.setColorAt(i, col);
    }
    for (var j = 0; j < 700; j++) {
      var s2 = j % 2 === 0 ? -1 : 1;
      var lz = aisleZ0 + rnd() * aisleLen;
      var lx = s2 * (1.82 + rr(-0.38, 0.38));
      var ly = 0.18 + rr(0, 0.24);

  // ---------- Guest Seating (flanking the yellow aisle) ----------

  // ---------- GRAND 5-BAY PANORAMIC WEDDING STAGE ----------
  var PZ = STAGE.z;
  var M = new THREE.Group(); M.position.set(STAGE.x, 0, PZ); scene.add(M);
  var MSTAGE_W = STAGE.w, MSTAGE_D = STAGE.d, MSTAGE_H = STAGE.h;
  var chandelierSwings = [], stageGlowLights = [];

  // Shared procedural textures for the stage
  // 1. Light-blue pleated satin skirting along the front & sides of the stage
  var texBlueSkirt = canvasTex(1024, 256, function (g, w, h) {
    for (var x = 0; x < w; x++) {
      var pleat = Math.sin(x / w * Math.PI * 2 * 48);
      var pleat2 = Math.cos(x / w * Math.PI * 2 * 16);
      var shade = 0.5 + 0.35 * pleat + 0.15 * pleat2;
      var r = (92 + shade * 55) | 0;
      var gr = (152 + shade * 62) | 0;
      var b = (212 + shade * 42) | 0;
      g.fillStyle = "rgb(" + r + "," + gr + "," + b + ")";
      g.fillRect(x, 0, 1, h);
    }
    // Top gathered header shadow & bottom hem highlight
    var topGr = g.createLinearGradient(0, 0, 0, h);
    topGr.addColorStop(0, "rgba(15, 35, 70, 0.45)");
    topGr.addColorStop(0.12, "rgba(0, 0, 0, 0)");
    topGr.addColorStop(0.88, "rgba(0, 0, 0, 0)");
    topGr.addColorStop(1, "rgba(10, 25, 55, 0.4)");
    g.fillStyle = topGr; g.fillRect(0, 0, w, h);
  }, 4, 1);

  // 2. Terracotta / red-orange patterned stage top carpet
  var texStageCarpet = canvasTex(1024, 512, function (g, w, h) {
    g.fillStyle = "#b8432e"; g.fillRect(0, 0, w, h);
    for (var y = 0; y < h; y += 48) {
      g.fillStyle = "rgba(235, 185, 135, 0.28)"; g.fillRect(0, y, w, 10);
      g.fillStyle = "rgba(120, 28, 18, 0.35)"; g.fillRect(0, y + 20, w, 8);
    }
    g.strokeStyle = "rgba(245, 210, 170, 0.32)"; g.lineWidth = 3;
    for (var x = 32; x < w; x += 96) {
      g.strokeRect(x, 16, 64, h - 32);
    }
  }, 4, 2);

  // 3. Sheer vertical pleated ivory/white backdrop curtains
  var texWhiteCurtain = canvasTex(512, 512, function (g, w, h) {
    for (var x = 0; x < w; x++) {
      var fold = 0.5 + 0.5 * Math.sin(x / w * Math.PI * 2 * 22);
      var c = (232 + fold * 22) | 0;
      g.fillStyle = "rgb(" + c + "," + (c - 3) + "," + (c - 9) + ")";

  // Helper to populate lush 3D flower clusters (cornices, diagonal pillar swags, table centerpieces, wall medallions)
  var flowerCloudMeshes = [];
  var flowerBoxList = []; // collects flower descriptors for instanced rendering
  function addFloralVolume(cx, cy, cz, sx, sy, sz, count, rotZ, paletteType) {
    for (var i = 0; i < count; i++) {
      var lx = (rnd() - 0.5) * sx;
      var ly = (rnd() - 0.5) * sy;
      var lz = (rnd() - 0.5) * sz;
      // Rotate in XY plane by rotZ for diagonal pillar swags
      var cosZ = Math.cos(rotZ || 0), sinZ = Math.sin(rotZ || 0);
      var rx = lx * cosZ - ly * sinZ;
      var ry = lx * sinZ + ly * cosZ;
      flowerBoxList.push({
        x: cx + rx,
        y: cy + ry,
        z: cz + lz,
        s: rr(0.75, 1.38),
        p: paletteType || "stage"
      });
    }
  }

  // 1. Build Stage Platform, Blue Pleated Skirting, Center 3-Step Stairs, Front Floral Troughs & Monitors

  // 2. Build the 5-Bay Stepped White-Draped Backdrop, Columns, Floral Cornices & Inward-Slanting Diagonal Pillar Swags
  function buildFiveBayBackdropAndFlorals() {
    var g = new THREE.Group();
    var y0 = MSTAGE_H;
    var backZ = -1.45;
    var pillarMat = std(0xfaf6f0, { roughness: 0.58 });
    var curtainMat = std(0xffffff, { map: texWhiteCurtain, bumpMap: texWhiteCurtain, bumpScale: 0.02, roughness: 0.65 });

    // Helper for a backdrop bay with pleated white curtains, framing white pillars, and top floral beam
    function buildBay(xLeft, xRight, height, zOffset, topFloralThickness) {
      var w = xRight - xLeft, cx = (xLeft + xRight) / 2;
      // Pleated white backdrop curtain
      var curtain = new THREE.Mesh(new THREE.BoxGeometry(w - 0.1, height - 0.15, 0.12), curtainMat);
      curtain.position.set(cx, y0 + (height - 0.15) / 2, backZ + zOffset - 0.18);
      curtain.receiveShadow = true; g.add(curtain);

      // Top white architectural lintel beam
      var lintel = new THREE.Mesh(new THREE.BoxGeometry(w + 0.36, 0.42, 0.48), pillarMat);
      lintel.position.set(cx, y0 + height - 0.21, backZ + zOffset);
      lintel.castShadow = true; lintel.receiveShadow = true; g.add(lintel);

      // Overflowing pink, magenta, blush & white floral header crowning the lintel
      var flowerCount = Math.floor(w * 68);
      addFloralVolume(cx, y0 + height - 0.08, backZ + zOffset + 0.22, w + 0.45, topFloralThickness, 0.58, flowerCount, 0, "stage");
    }

    // Helper for a vertical white square pillar with optional inward-slanting diagonal floral swag
    function buildPillar(x, height, zOffset, pWidth, swagDir) {
      var p = new THREE.Mesh(new THREE.BoxGeometry(pWidth, height, 0.44), pillarMat);
      p.position.set(x, y0 + height / 2, backZ + zOffset);
      p.castShadow = true; p.receiveShadow = true; g.add(p);

      // Base molding
      var plinth = new THREE.Mesh(new THREE.BoxGeometry(pWidth + 0.08, 0.18, 0.52), pillarMat);
      plinth.position.set(x, y0 + 0.09, backZ + zOffset); g.add(plinth);

      // Diagonal floral swag bar mounted across the pillar face
      // On the left side of the stage (x < 0), swags slant "\" (top-left to bottom-right, rotZ = -0.55)
      // On the right side of the stage (x > 0), swags slant "/" (bottom-left to top-right, rotZ = +0.55)
      if (swagDir !== 0) {
        var swagY = y0 + 3.25;
        var rotZ = swagDir < 0 ? -0.56 : 0.56;
        var foliageBar = new THREE.Mesh(new THREE.BoxGeometry(0.24, 1.58, 0.22), std(0x284d26, { roughness: 0.85 }));
        foliageBar.position.set(x, swagY, backZ + zOffset + 0.24);
        foliageBar.rotation.z = rotZ;
        g.add(foliageBar);
        addFloralVolume(x, swagY, backZ + zOffset + 0.30, 0.46, 1.68, 0.38, 72, rotZ, "stage");
      }
    }

    // --- BAY 3: Wide Central Bay (x from -3.25 to +3.25, height 5.35m) ---
    buildBay(-3.25, 3.25, 5.35, 0.0, 0.62);
    // Inner and outer column pairs flanking the Center Bay
    buildPillar(-2.35, 5.35, 0.08, 0.36, -1);
    buildPillar(-3.25, 5.35, 0.12, 0.38, -1);
    buildPillar(2.35, 5.35, 0.08, 0.36, 1);
    buildPillar(3.25, 5.35, 0.12, 0.38, 1);

    // Central round white & blush floral pomander medallion above the Maharaja sofa
    addFloralVolume(0, y0 + 2.95, backZ - 0.02, 0.85, 0.82, 0.38, 65, 0, "whiteBlush");

    // --- BAY 2 (Inner-Left Tallest Bay, x from -7.15 to -3.25, height 6.35m) ---
    buildBay(-7.15, -3.25, 6.35, 0.18, 0.72);
    buildPillar(-3.55, 6.35, 0.22, 0.42, 0);
    buildPillar(-7.05, 6.35, 0.22, 0.42, -1);
    // Floating diagonal floral cluster on the center of Bay 2's sheer curtain
    addFloralVolume(-5.25, y0 + 2.95, backZ + 0.08, 0.42, 0.95, 0.28, 42, 0.52, "stage");

    // --- BAY 4 (Inner-Right Tallest Bay, x from +3.25 to +7.15, height 6.35m) ---
    buildBay(3.25, 7.15, 6.35, 0.18, 0.72);
    buildPillar(3.55, 6.35, 0.22, 0.42, 0);
    buildPillar(7.05, 6.35, 0.22, 0.42, 1);
    // Floating diagonal floral cluster on the center of Bay 4's sheer curtain
    addFloralVolume(5.25, y0 + 2.95, backZ + 0.08, 0.42, 0.95, 0.28, 42, -0.52, "stage");

    // --- NARROW CHANDELIER BRIDGES between Bay 1-2 (x: -7.95 to -7.15) & Bay 4-5 (x: +7.15 to +7.95) ---
    buildBay(-7.95, -7.15, 5.25, 0.02, 0.56);
    buildBay(7.15, 7.95, 5.25, 0.02, 0.56);

    // --- BAY 1 (Far-Left Wing Bay, x from -10.95 to -7.95, height 5.95m) ---
    buildBay(-10.95, -7.95, 5.95, 0.14, 0.68);
    buildPillar(-7.95, 5.95, 0.18, 0.38, -1);
    buildPillar(-10.85, 5.95, 0.18, 0.42, -1);
    addFloralVolume(-9.45, y0 + 2.85, backZ + 0.05, 0.38, 0.85, 0.26, 36, 0.5, "stage");

    // --- BAY 5 (Far-Right Wing Bay, x from +7.95 to +10.95, height 5.95m) ---
    buildBay(7.95, 10.95, 5.95, 0.14, 0.68);
    buildPillar(7.95, 5.95, 0.18, 0.38, 1);
    buildPillar(10.85, 5.95, 0.18, 0.42, 1);
    addFloralVolume(9.45, y0 + 2.85, backZ + 0.05, 0.38, 0.85, 0.26, 36, -0.5, "stage");

    M.add(g);
  }

  // 3. Build the 5 White/Gold Empire Cone Chandeliers & 6 Gold Multi-Arm Candelabra Chandeliers
  function buildChandeliers() {
    var y0 = MSTAGE_H, backZ = -1.25;
    var creamGlowMat = new THREE.MeshStandardMaterial({
      color: 0xfff5e4,
      emissive: 0xffcf88,
      emissiveIntensity: 0.65,
      roughness: 0.32,
      metalness: 0.05,
      side: THREE.DoubleSide
    });
    var goldTrimMat = new THREE.MeshStandardMaterial({
      color: 0xe6b84a,
      metalness: 0.85,
      roughness: 0.2,
      emissive: 0x422a05
    });
    var bulbMat = new THREE.MeshBasicMaterial({ color: 0xfff2c8 });

    // Large White/Cream Empire Chandelier with Gold Band (5 total: one centered in each of the 5 bays)
    function createEmpireChandelier(x, topY, z, scale) {
      var pivot = new THREE.Group();
      pivot.position.set(x, topY, z);

      var chainLen = 0.45 * scale;
      var chain = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, chainLen, 8), goldTrimMat);
      chain.position.y = -chainLen / 2; pivot.add(chain);

      var body = new THREE.Group();
      body.position.y = -chainLen;

      // Upper fluted white silk/crystal bell
      var upperCone = new THREE.Mesh(new THREE.CylinderGeometry(0.14 * scale, 0.56 * scale, 0.72 * scale, 24), creamGlowMat);
      upperCone.position.y = -0.36 * scale; body.add(upperCone);

      // Prominent gold horizontal waist band
      var midRing = new THREE.Mesh(new THREE.TorusGeometry(0.57 * scale, 0.045 * scale, 12, 32), goldTrimMat);
      midRing.rotation.x = Math.PI / 2; midRing.position.y = -0.72 * scale; body.add(midRing);

      // Middle cylindrical tier
      var midDrum = new THREE.Mesh(new THREE.CylinderGeometry(0.55 * scale, 0.46 * scale, 0.28 * scale, 24), creamGlowMat);
      midDrum.position.y = -0.86 * scale; body.add(midDrum);

      var lowerRing = new THREE.Mesh(new THREE.TorusGeometry(0.46 * scale, 0.03 * scale, 10, 28), goldTrimMat);
      lowerRing.rotation.x = Math.PI / 2; lowerRing.position.y = -1.0 * scale; body.add(lowerRing);

      // Lower inverted cone pendant tip
      var lowerCone = new THREE.Mesh(new THREE.CylinderGeometry(0.44 * scale, 0.05 * scale, 0.58 * scale, 24), creamGlowMat);
      lowerCone.position.y = -1.29 * scale; body.add(lowerCone);

      var finial = new THREE.Mesh(new THREE.SphereGeometry(0.065 * scale, 12, 10), goldTrimMat);
      finial.position.y = -1.6 * scale; body.add(finial);

      var pl = new THREE.PointLight(0xffd28e, 0.85, 8.5);
      pl.position.set(0, -0.9 * scale, 0); body.add(pl);
      stageGlowLights.push({ light: pl, base: 0.85 });

      pivot.add(body);
      M.add(pivot);
      chandelierSwings.push({ group: pivot, phase: x * 0.45, amp: 0.015 });
    }

    // Gold Multi-Arm Candelabra Chandelier (6 total: 4 across Center Bay + 2 in outer column bridges)
    function createGoldArmChandelier(x, topY, z, scale) {
      var pivot = new THREE.Group();
      pivot.position.set(x, topY, z);

      var rodLen = 0.78 * scale;
      var rod = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, rodLen, 8), goldTrimMat);
      rod.position.y = -rodLen / 2; pivot.add(rod);

      var hub = new THREE.Group();
      hub.position.y = -rodLen;

      var centerColumn = new THREE.Mesh(new THREE.CylinderGeometry(0.04 * scale, 0.07 * scale, 0.42 * scale, 12), goldTrimMat);
      centerColumn.position.y = -0.15 * scale; hub.add(centerColumn);

      var centerBall = new THREE.Mesh(new THREE.SphereGeometry(0.08 * scale, 12, 10), goldTrimMat);
      centerBall.position.y = -0.4 * scale; hub.add(centerBall);

      var arms = 6;
      for (var a = 0; a < arms; a++) {
        var ang = (a / arms) * Math.PI * 2;
        var armGroup = new THREE.Group();
        armGroup.rotation.y = ang;

        // Curved gold arm
        var armBar = new THREE.Mesh(new THREE.TorusGeometry(0.22 * scale, 0.015 * scale, 8, 16, Math.PI * 0.85), goldTrimMat);
        armBar.position.set(0.22 * scale, -0.14 * scale, 0);
        armBar.rotation.z = Math.PI * 1.08;
        armGroup.add(armBar);

        // Bobeche dish + glowing candle bulb
        var dish = new THREE.Mesh(new THREE.CylinderGeometry(0.055 * scale, 0.03 * scale, 0.03 * scale, 10), goldTrimMat);
        dish.position.set(0.42 * scale, -0.06 * scale, 0);
        armGroup.add(dish);

        var candle = new THREE.Mesh(new THREE.CylinderGeometry(0.018 * scale, 0.018 * scale, 0.11 * scale, 8), IVORY);
        candle.position.set(0.42 * scale, 0.0 * scale, 0);
        armGroup.add(candle);

        var flame = new THREE.Mesh(new THREE.SphereGeometry(0.032 * scale, 8, 8), bulbMat);
        flame.scale.set(0.8, 1.5, 0.8);
        flame.position.set(0.42 * scale, 0.08 * scale, 0);
        armGroup.add(flame);

        hub.add(armGroup);
      }

      var pl = new THREE.PointLight(0xffc978, 0.55, 6.5);
      pl.position.set(0, -0.15 * scale, 0); hub.add(pl);
      stageGlowLights.push({ light: pl, base: 0.55 });

      pivot.add(hub);
      M.add(pivot);
      chandelierSwings.push({ group: pivot, phase: x * 0.7 + 1.2, amp: 0.02 });
    }

    // 5 Empire Chandeliers (one in each bay: Bay 1, Bay 2, Center Bay 3, Bay 4, Bay 5)
    createEmpireChandelier(-9.45, y0 + 5.65, backZ + 0.18, 0.96);
    createEmpireChandelier(-5.25, y0 + 6.05, backZ + 0.25, 1.05);
    createEmpireChandelier(0.0,   y0 + 5.05, backZ + 0.08, 0.98);
    createEmpireChandelier(5.25,  y0 + 6.05, backZ + 0.25, 1.05);
    createEmpireChandelier(9.45,  y0 + 5.65, backZ + 0.18, 0.96);

    // 6 Gold Multi-Arm Chandeliers (2 flanking center chandelier, 2 in center-bay column alcoves, 2 in outer bay bridges)
    createGoldArmChandelier(-1.35, y0 + 5.0, backZ + 0.08, 0.95);
    createGoldArmChandelier(1.35,  y0 + 5.0, backZ + 0.08, 0.95);
    createGoldArmChandelier(-2.80, y0 + 5.0, backZ + 0.14, 0.90);
    createGoldArmChandelier(2.80,  y0 + 5.0, backZ + 0.14, 0.90);
    createGoldArmChandelier(-7.55, y0 + 4.95, backZ + 0.12, 0.92);
    createGoldArmChandelier(7.55,  y0 + 4.95, backZ + 0.12, 0.92);
  }

  // 4. Build the Central Silver-and-White Tufted Maharaja Sofa, 2 Mirrored Geometric Consoles & 2 White Pedestals
  function buildStageFurnitureAndProps() {
    var fg = new THREE.Group();
    fg.position.y = MSTAGE_H;

    // Tufted white/ice-blue velvet texture for the Maharaja sofa
    var texTuftedVelvet = canvasTex(512, 256, function (g, w, h) {

    mg.fillStyle = "rgba(235, 188, 38, 0.55)"; mg.fillRect(mx(-1.7), sz1, mx(1.7) - mx(-1.7), mz(16.5) - sz1);
    // Guest seating blocks
    mg.fillStyle = "rgba(244,234,216,0.28)";
    mg.fillRect(mx(-9.8), mz(-2.2), mx(-2.6) - mx(-9.8), mz(10.0) - mz(-2.2));
    mg.fillRect(mx(2.6), mz(-2.2), mx(9.8) - mx(2.6), mz(10.0) - mz(-2.2));
    mg.fillStyle = "#ffcf85"; mg.font = "18px sans-serif"; mg.textAlign = "center";
    mg.fillText("5-bay stage", mx(0), mz(STAGE.z) + 6);
    mg.fillText("aisle", mx(0), mz(4.0) + 6);
    mg.fillText("entry ➜", mx(-9.5), mz(16) + 4);
    // Camera marker with look direction
    var x = mx(camera.position.x), z = mz(camera.position.z);
    var dir = new THREE.Vector3(); camera.getWorldDirection(dir);
    var ang = Math.atan2(dir.z, dir.x);
    mg.fillStyle = "#f5b642";
    mg.beginPath(); mg.moveTo(x, z); mg.arc(x, z, 34, ang - 0.45, ang + 0.45); mg.closePath(); mg.globalAlpha = 0.45; mg.fill(); mg.globalAlpha = 1;
    mg.beginPath(); mg.arc(x, z, 5.5, 0, 6.283); mg.fill();
  }

  // ---------- Resize + Render Loop ----------
  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
  });
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var lastT = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (fly) {
      var k = Math.min(1, (now - fly.t0) / (reduce ? 1 : fly.dur)), e = ease(k);
      camera.position.lerpVectors(fly.p0, fly.p1, e); controls.target.lerpVectors(fly.t0v, fly.t1, e);
      if (k >= 1) fly = null;
    } else if (tour) {
      var u = Math.min(1, (now - tour.t0) / tour.dur), ue = ease(u);
      camera.position.copy(tourPos.getPoint(Math.min(1, ue))); controls.target.copy(tourTgt.getPoint(Math.min(1, ue)));
      if (u >= 1) tour = null;
    } else if (spin) {
      var off = camera.position.clone().sub(controls.target); var a = dt * 0.16;
      var cx = off.x * Math.cos(a) - off.z * Math.sin(a), cz = off.x * Math.sin(a) + off.z * Math.cos(a); off.x = cx; off.z = cz;
      camera.position.copy(controls.target).add(off);
    }
    controls.update();

    var goal = night ? 1 : 0; nightAmt += (goal - nightAmt) * Math.min(1, dt * 2.5);
    var na = nightAmt;
    skyU.uDusk.value = na;
    var el = 0.09 - 0.17 * na; sunDir.set(-0.12, el, -1).normalize(); skyU.uSun.value.copy(sunDir);
    sun.position.copy(sunDir).multiplyScalar(110).add(new THREE.Vector3(0, 0, -10)); if (el < 0.02) sun.position.y = 2.5 + (el + 0.08) * 40;
    sun.intensity = 1.9 * (1 - na); hemi.intensity = 0.38 - 0.22 * na;
    fill.intensity = 0.45 * (1 - na); moon.intensity = 0.42 * na; ambient.intensity = 0.18 * na;
    cloudMats.forEach(function (m) { m.opacity = m.userData.base * (1 - 0.78 * na); });
    scene.environment = na > 0.5 ? envEvening : envSunset;
    scene.fog.color.copy(FOG_SUNSET).lerp(FOG_EVENING, na);
    renderer.toneMappingExposure = 0.85 + 0.18 * na;
    fairy.material.opacity = 0.45 + 0.5 * na; fairy.material.size = 0.35 + 0.12 * na;

    var el2 = now / 1000;
    chandelierSwings.forEach(function (ch) {
      ch.group.rotation.z = (reduce ? 0 : Math.sin(el2 * 1.3 + ch.phase) * ch.amp);
      ch.group.rotation.x = (reduce ? 0 : Math.cos(el2 * 1.05 + ch.phase) * ch.amp * 0.6);
    });
    stageGlowLights.forEach(function (sl, idx) {
      sl.light.intensity = sl.base * (0.45 + 0.95 * na) * (1 + Math.sin(el2 * 3.2 + idx) * 0.04);
    });

    renderer.render(scene, camera);
    drawMap();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(function () { document.getElementById("loading").classList.add("done"); }, 350);
})();
